<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Todo List</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <nav class="rail" id="projects" aria-label="Proyectos"></nav>

    <div class="main">
      <header class="header">
        <div class="header__text">
          <h1 class="title" data-i18n="appTitle">Mis Tareas</h1>
          <p class="counter" id="counter" aria-live="polite">Sin tareas</p>
        </div>

        <button
          class="theme-button"
          id="theme-button"
          type="button"
          aria-label="Cambiar tema"
          title="Cambiar tema"
          data-i18n-aria-label="themeToggle"
          data-i18n-title="themeToggle"
        >
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z" />
          </svg>
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
        </button>
      </header>

      <form class="new-task" id="new-task-form" autocomplete="off">
        <svg class="new-task__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <input
          class="new-task__input"
          id="new-task-input"
          type="text"
          placeholder="Añadir tarea…"
          aria-label="Nueva tarea"
          data-i18n-placeholder="newTaskPlaceholder"
          data-i18n-aria-label="newTaskLabel"
          aria-describedby="new-task-hint"
          maxlength="200"
          required
        />
        <span class="new-task__hint" id="new-task-hint" data-i18n="enterHint">Intro</span>
      </form>

      <ul class="task-list" id="task-list"></ul>

      <p class="empty" id="empty-state" data-i18n="emptyState" hidden>Nada pendiente.</p>
    </div>

    <template id="task-template">
      <li class="task">
        <label class="task__label">
          <input class="task__checkbox" type="checkbox" />
          <span class="task__text"></span>
          <span class="task__project" hidden></span>
        </label>
        <button
          class="task__edit"
          type="button"
          aria-label="Editar tarea"
          title="Editar tarea"
          data-i18n-aria-label="editTask"
          data-i18n-title="editTask"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M11.3 2.3a1.5 1.5 0 0 1 2.1 0l.3.3a1.5 1.5 0 0 1 0 2.1L5.4 13 2 14l1-3.4z"
            />
          </svg>
        </button>
        <button
          class="task__delete"
          type="button"
          aria-label="Eliminar tarea"
          title="Eliminar tarea"
          data-i18n-aria-label="deleteTask"
          data-i18n-title="deleteTask"
        >
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M1.5 1.5l9 9M10.5 1.5l-9 9" />
          </svg>
        </button>
      </li>
    </template>

    <template id="rail-icon-template">
      <span class="rail-icon">
        <button type="button" class="rail-icon__select">
          <span class="rail-icon__label"></span>
        </button>
        <button
          type="button"
          class="rail-icon__edit"
          aria-label="Editar proyecto"
          title="Editar proyecto"
          data-i18n-aria-label="editProject"
          data-i18n-title="editProject"
          hidden
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M11.3 2.3a1.5 1.5 0 0 1 2.1 0l.3.3a1.5 1.5 0 0 1 0 2.1L5.4 13 2 14l1-3.4z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="rail-icon__delete"
          aria-label="Eliminar proyecto"
          title="Eliminar proyecto"
          data-i18n-aria-label="deleteProject"
          data-i18n-title="deleteProject"
          hidden
        >
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M1.5 1.5l9 9M10.5 1.5l-9 9" />
          </svg>
        </button>
      </span>
    </template>

    <template id="project-edit-template">
      <div class="project-edit">
        <button
          type="button"
          class="project-edit__avatar"
          aria-label="Cambiar imagen"
          title="Cambiar imagen"
          data-i18n-aria-label="changeImage"
          data-i18n-title="changeImage"
        >
          <span class="project-edit__avatar-content"></span>
          <span class="project-edit__avatar-overlay" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 8h3l1.6-2.2a1 1 0 0 1 .8-.4h5.2a1 1 0 0 1 .8.4L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"
              />
              <circle cx="12" cy="13.5" r="3.3" />
            </svg>
          </span>
        </button>
        <input type="file" class="project-edit__file" accept="image/*" hidden />

        <input
          type="text"
          class="project-edit__name"
          maxlength="40"
          placeholder="Nombre del proyecto"
          aria-label="Nombre del proyecto"
          data-i18n-placeholder="newProjectPlaceholder"
          data-i18n-aria-label="newProjectPlaceholder"
        />

        <button
          type="button"
          class="project-edit__remove-icon"
          data-i18n="removeImage"
          hidden
        >
          Quitar imagen
        </button>

        <div class="project-edit__actions">
          <button type="button" class="project-edit__cancel" data-i18n="cancel">Cancelar</button>
          <button type="button" class="project-edit__save" data-i18n="save">Guardar</button>
        </div>
      </div>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
