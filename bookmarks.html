<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Marcadores</title>
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="bookmarks.css" />
  </head>
  <body>
    <aside class="folders">
      <h1 class="folders__title" data-i18n="bookmarksTitle">Marcadores</h1>
      <nav class="folders__tree" id="folder-tree" aria-label="Carpetas" data-i18n-aria-label="foldersLabel"></nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta" data-i18n-aria-label="breadcrumbLabel"></nav>

        <div class="topbar__actions">
          <button
            class="icon-button"
            id="view-button"
            type="button"
            aria-label="Cambiar vista"
            title="Cambiar vista"
            data-i18n-aria-label="toggleView"
            data-i18n-title="toggleView"
          >
            <svg class="icon icon--grid" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="4" y="4" width="7" height="7" rx="1.5" />
              <rect x="13" y="4" width="7" height="7" rx="1.5" />
              <rect x="4" y="13" width="7" height="7" rx="1.5" />
              <rect x="13" y="13" width="7" height="7" rx="1.5" />
            </svg>
            <svg class="icon icon--list" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>

          <button
            class="icon-button"
            id="theme-button"
            type="button"
            aria-label="Cambiar tema"
            title="Cambiar tema"
            data-i18n-aria-label="themeToggle"
            data-i18n-title="themeToggle"
          >
            <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z" />
            </svg>
            <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
            </svg>
          </button>
        </div>
      </header>

      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4.5 4.5" />
        </svg>
        <input
          class="search__input"
          id="search-input"
          type="search"
          placeholder="Buscar marcadores…"
          aria-label="Buscar marcadores"
          data-i18n-placeholder="searchPlaceholder"
          data-i18n-aria-label="searchPlaceholder"
        />
        <span class="search__count" id="search-count" aria-live="polite"></span>
      </div>

      <div class="items" id="items"></div>

      <p class="empty" id="empty-state" hidden></p>

      <button class="show-more" id="show-more" type="button" data-i18n="showMore" hidden>
        Mostrar más
      </button>
    </main>

    <template id="folder-node-template">
      <div class="tree-node">
        <button
          type="button"
          class="tree-node__twisty"
          aria-label="Desplegar"
          title="Desplegar"
          data-i18n-aria-label="expandFolder"
          data-i18n-title="expandFolder"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M6 4l4 4-4 4" />
          </svg>
        </button>
        <button type="button" class="tree-node__select">
          <svg class="tree-node__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" />
          </svg>
          <span class="tree-node__name"></span>
          <span class="tree-node__count"></span>
        </button>
      </div>
    </template>

    <template id="bookmark-template">
      <a class="card card--bookmark" href="#">
        <span class="card__icon">
          <img class="card__favicon" alt="" />
        </span>
        <span class="card__body">
          <span class="card__title"></span>
          <span class="card__sub"></span>
        </span>
      </a>
    </template>

    <template id="folder-card-template">
      <button type="button" class="card card--folder">
        <span class="card__icon card__icon--folder">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" />
          </svg>
        </span>
        <span class="card__body">
          <span class="card__title"></span>
          <span class="card__sub"></span>
        </span>
      </button>
    </template>

    <template id="menu-template">
      <div class="menu" role="menu">
        <button type="button" class="menu__item" data-action="open" data-i18n="openInNewTab">
          Abrir en una pestaña nueva
        </button>
        <button type="button" class="menu__item" data-action="copy" data-i18n="copyUrl">
          Copiar dirección
        </button>
        <button type="button" class="menu__item" data-action="rename" data-i18n="rename">
          Renombrar
        </button>
        <button type="button" class="menu__item menu__item--danger" data-action="delete" data-i18n="delete">
          Eliminar
        </button>
      </div>
    </template>

    <script type="module" src="bookmarks.js"></script>
  </body>
</html>
